# Cifratura delle password di servizio delle schedulazioni (a riposo su DB). In PRODUZIONE passare
# valori reali via variabili d'ambiente e NON committarli. Il salt deve essere una stringa esadecimale.
batch.credentials.secret=${BATCH_CRED_SECRET:change-me-in-produzione}
batch.credentials.salt=${BATCH_CRED_SALT:5c0744940b5c369b}


########## SCHEDULAZIONI SFTP ##########
# Trasferimenti schedulati fra un server SFTP e be-storage, nelle due direzioni. A differenza dei batch
# (che chiamano un servizio remoto) l'elaborazione gira DENTRO be-batch, quindi qui servono l'URL dello
# storage e i timeout della connessione SSH.
api.storage.service.url=${API_SERVICE_STORAGE:http://localhost:8089/storage}
sftp.scheduler.fixed-delay-ms=${SFTP_SCHEDULER_DELAY_MS:30000}
# connect basso (fail-fast se il server e' spento), read lungo (file grandi su linee lente).
sftp.connect.timeout.ms=${SFTP_CONNECT_TIMEOUT_MS:20000}
sftp.read.timeout.ms=${SFTP_READ_TIMEOUT_MS:120000}
# Verifica dell'identita' del server: se valorizzato si usa quel file known_hosts, altrimenti si accetta
# QUALUNQUE chiave host (comodo in test, ma esposto a man-in-the-middle). In produzione montare il file
# nel pod e valorizzare SFTP_KNOWN_HOSTS.
sftp.known-hosts=${SFTP_KNOWN_HOSTS:}
# Tetto alla telecronaca (sftp_execution.log): il dettaglio e' di 2-3 righe per file, quindi su cartelle
# molto popolate il campo crescerebbe senza limite e ogni riga costa una riscrittura dell'intero testo.
# Oltre la soglia si scartano le righe piu' VECCHIE: la coda (dove si e' arrivati, errori, riepilogo)
# resta sempre leggibile.
sftp.log.max-caratteri=${SFTP_LOG_MAX_CARATTERI:200000}
# ARCHIVI ZIP prelevati da SFTP: su storage finiscono i FILE CONTENUTI, non l'archivio (che viene
# scartato dopo l'estrazione). Sul server remoto lo zip segue la politica post-trasferimento
# configurata sulla schedulazione. Mettere a false per trasferire gli zip cosi' come sono.
sftp.zip.estrai=${SFTP_ZIP_ESTRAI:true}
# Tetto per singolo file estratto: difesa contro gli archivi "zip bomb" (pochi KB compressi che
# diventano gigabyte). Il limite riguarda lo SPAZIO SU DISCO — l'estrazione e' in streaming, non in
# memoria — quindi puo' essere generoso. Le voci oltre soglia vengono saltate con un avviso e il resto
# prosegue. 0 = nessun limite.
sftp.zip.max-file-mb=${SFTP_ZIP_MAX_FILE_MB:4096}
# Cartella di transito dei file scaricati/estratti. Con archivi da GB serve spazio: nei container la
# temp di sistema e' spesso piccola, qui si punta a un volume capiente. Vuoto = temp di sistema.
# Serve spazio per l'archivio PIU' la voce in corso di estrazione (le voci gia' caricate si cancellano).
sftp.temp.dir=${SFTP_TEMP_DIR:C:/work/storage/temp}
# Durata massima di una singola richiesta HTTP verso be-storage. Un file da qualche GB su linea lenta
# impiega molto e il timeout dei RestTemplate condivisi lo taglierebbe a meta'.
sftp.http.timeout.min=${SFTP_HTTP_TIMEOUT_MIN:120}
# Rete di sicurezza: se be-batch viene riavviato a meta' trasferimento la riga resterebbe PENDING per
# sempre (clessidra infinita). Qui si chiudono d'ufficio come FAILED.
sftp.execution.stale-timeout-hours=${SFTP_STALE_TIMEOUT_HOURS:6}
sftp.execution.stale-check-ms=${SFTP_STALE_CHECK_MS:600000}
########## SCHEDULAZIONI SFTP ##########

########## START Endpoint interni
api.base.service.url=${API_SERVICE_BASE:http://localhost:8082/base}

# URL completo di login batch su be-base. ATTENZIONE: il nome di questa property NON deve
# coincidere (via relaxed-binding) con la env var usata come base-host, altrimenti la env var
# scavalca l'intera riga e si perde il suffisso /login/doLoginBatch. La env resta URL_BEBASE_SERVICE
# (solo base-host, es. http://bebase-service:8080/base); la property si chiama url.bebase.login.
url.bebase.login=${api.base.service.url}/login/doLoginBatch

# Rete di sicurezza del flusso "202 + callback": se il servizio chiamato non richiama mai
# /batch-execution/{id}/finish (irraggiungibile, crashato, api.batch.service.url sbagliato)
# l'esecuzione resterebbe PENDING per sempre. Qui si chiudono d'ufficio come FAILED.
batch.execution.stale-timeout-hours=${BATCH_STALE_TIMEOUT_HOURS:6}
batch.execution.stale-check-ms=${BATCH_STALE_CHECK_MS:600000}
